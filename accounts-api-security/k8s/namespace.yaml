# Threat mapping: T4. Belt-and-suspenders with the Kyverno policies —
# built-in Pod Security Admission gives a baseline even if Kyverno is ever
# uninstalled or misconfigured; Kyverno gives the richer, auditable rules.
apiVersion: v1
kind: Namespace
metadata:
  name: accounts-api
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
