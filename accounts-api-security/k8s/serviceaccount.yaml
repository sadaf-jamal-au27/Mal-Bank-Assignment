# IRSA binding — this ServiceAccount name/namespace pair is exactly what the
# IAM trust policy in terraform/iam.tf's `irsa_trust` condition matches
# against (system:serviceaccount:accounts-api:accounts-api). Renaming either
# without updating the other silently breaks the trust boundary — noted
# here so a reviewer sees the coupling explicitly.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: accounts-api
  namespace: accounts-api
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/accounts-api-prod-irsa"
automountServiceAccountToken: true
